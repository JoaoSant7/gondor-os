# Managed image defaults. Edit this file for machine-specific settings.
# SDDM loads /usr/lib/sddm/sddm.conf.d, /etc/sddm.conf.d, then this file.
[General]
DisplayServer=wayland
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QT_QUICK_CONTROLS_STYLE=Basic

[Theme]
ThemeDir=/usr/share/sddm/themes
Current=sddm-astronaut-theme

[Wayland]
# Fedora's sddm-wayland-generic supplies Weston without pulling in Plasma.
CompositorCommand=/usr/bin/weston --shell=kiosk

[Users]
RememberLastUser=true
RememberLastSession=true

[Autologin]
# Clear inherited Bazzite/Plasma defaults so the greeter always appears.
User=
Session=
Relogin=false
